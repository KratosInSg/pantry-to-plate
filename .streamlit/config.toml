# Theme for the Streamlit prototype (src/ui). The look itself lives in src/ui/theme.py; this sets the base colours
# Streamlit's own widgets use, so the two agree.
[theme]
base = "light"
primaryColor = "#2F6B4F"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F3F0EA"
textColor = "#1F2A24"
font = "sans serif"

[browser]
gatherUsageStats = false

# Security review 2026-10-14: never show visitors a traceback (it reveals file paths and source code). Errors still
# reach the terminal / log. Set to "full" locally if you want them on the page while developing.
[client]
showErrorDetails = "none"
# Hide developer-only menu items (rerun / settings / "deploy") from visitors.
toolbarMode = "viewer"
